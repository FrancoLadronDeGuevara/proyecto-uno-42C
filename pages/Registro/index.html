      <!-------------------------- REGISTRO ---------------------------------------->
    <div class="container-login">
        <div class="wrapper bg-white">
          <div class="h2 text-center">Registrarse</div>
          <form id="formulario" class="pt-3">
            <div class="form-group py-2">
              <div class="input-field">
                <i class="bi bi-person-fill p-2"></i>
                <input
                  id="inputEmail"
                  type="email"
                  placeholder="Ingrese su correo"
                  required
                />
              </div>
            </div>
            <div class="form-group py-1 pb-2">
              <div class="input-field">
                <i class="bi bi-lock-fill p-2"></i>
                <input
                  id="inputPassword"
                  type="password"
                  placeholder="Ingrese una contraseña"
                  required
                />
                <button class="btn">
                    <i class="bi bi-eye-fill"></i>
                </button>
              </div>
            </div>
            <div class="form-group py-1 pb-2">
              <div class="input-field">
                <i class="bi bi-lock-fill p-2"></i>
                <input
                  id="inputPassword2"
                  type="password"
                  placeholder="Confirmar contraseña"
                  required
                />
                <button class="btn">
                    <i class="bi bi-eye-fill"></i>
                </button>
              </div>
            </div>
            <div class="d-flex align-items-center">
              <div class="d-flex align-items-center gap-3">
                <input class="form-check-input" type="checkbox" name="checkbox" id="inputCheckbox">
                <label class="text-muted">
                  Acepto los términos y condiciones
                </label>
              </div>
            </div>
            <button type="submit" class="btn btn-block text-center my-3">
              Registrarse
            </button>
            <div class="text-center pt-3 text-muted">
              Ya tienes una cuenta?
              <a href="../Login/index.html">Iniciar Sesión</a>
            </div>
          </form>
        </div>
      </div>
      <!-------------------------- FIN REGISTRO ---------------------------------------->
